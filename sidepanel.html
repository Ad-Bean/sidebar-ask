<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidebar Ask</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- 全部 UI 只有这一条 34px 的顶栏，没有底部横幅、没有评分提示 -->
  <header class="bar">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="14" height="14">
        <rect x="0.5" y="0.5" width="15" height="15" rx="4.5" fill="#4A5260" />
        <path d="M4.6 5.4h6.8a1.2 1.2 0 0 1 1.2 1.2v3a1.2 1.2 0 0 1-1.2 1.2H7.2L5 12.2V10.8h-.4a1.2 1.2 0 0 1-1.2-1.2v-3a1.2 1.2 0 0 1 1.2-1.2z" fill="#fff" />
        <circle cx="6" cy="8" r="0.85" fill="#4A5260" />
        <circle cx="8" cy="8" r="0.85" fill="#4A5260" />
        <circle cx="10" cy="8" r="0.85" fill="#4A5260" />
      </svg>
    </span>
    <span class="label">Sidebar Ask</span>
    <span class="status" id="status" title="未连接"></span>
    <span class="spacer"></span>

    <button class="icon-btn" id="btnPopout" title="在独立窗口中打开" aria-label="在独立窗口中打开">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2.5h4.5V7" />
        <path d="M13.5 2.5 7.5 8.5" />
        <path d="M12 9.8v2.7a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2.7" />
      </svg>
    </button>

    <button class="icon-btn" id="btnReload" title="重新加载（回到新对话）" aria-label="重新加载">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.75" />
        <path d="M13.5 2.2v3.2h-3.2" />
      </svg>
    </button>
  </header>

  <main class="stage">
    <iframe
      id="frame"
      src="https://chat.deepseek.com/"
      title="DeepSeek"
      allow="clipboard-read; clipboard-write; microphone; fullscreen"
    ></iframe>

    <div class="fallback" id="fallback" hidden>
      <p class="fb-title">侧边栏内嵌失败</p>
      <p class="fb-body">
        站点拒绝了 iframe 嵌入，或网络未能加载。<br />
        可以用独立窗口继续，功能完全一致。
      </p>
      <div class="fb-actions">
        <button class="btn primary" id="fbPopout">在独立窗口中打开</button>
        <button class="btn" id="fbRetry">重试</button>
      </div>
    </div>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>

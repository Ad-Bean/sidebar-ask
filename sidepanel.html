<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidebar Ask</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- The entire UI is this single 34px bar. No bottom banner, no rate prompt. -->
  <header class="bar">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 16 16" width="14" height="14">
        <rect x="0.5" y="0.5" width="15" height="15" rx="4.5" fill="#4A5260" />
        <path d="M4.6 5.4h6.8a1.2 1.2 0 0 1 1.2 1.2v3a1.2 1.2 0 0 1-1.2 1.2H7.2L5 12.2V10.8h-.4a1.2 1.2 0 0 1-1.2-1.2v-3a1.2 1.2 0 0 1 1.2-1.2z" fill="#fff" />
        <circle cx="6" cy="8" r="0.85" fill="#4A5260" />
        <circle cx="8" cy="8" r="0.85" fill="#4A5260" />
        <circle cx="10" cy="8" r="0.85" fill="#4A5260" />
      </svg>
    </span>
    <span class="label">Sidebar Ask</span>
    <span class="status" id="status"></span>
    <span class="spacer"></span>

    <button class="icon-btn" id="btnPopout" data-i18n-title="popoutTitle" title="Open in a separate window" aria-label="Open in a separate window">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2.5h4.5V7" />
        <path d="M13.5 2.5 7.5 8.5" />
        <path d="M12 9.8v2.7a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2.7" />
      </svg>
    </button>

    <button class="icon-btn" id="btnReload" data-i18n-title="reloadTitle" title="Reload (back to a new chat)" aria-label="Reload">
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.75" />
        <path d="M13.5 2.2v3.2h-3.2" />
      </svg>
    </button>
  </header>

  <!-- Pushes the page down instead of covering it: no fixed overlays anywhere -->
  <div class="notice" id="notice" hidden>
    <span class="notice-text" id="noticeText"></span>
    <button class="link-btn" id="noticeDetails" data-i18n="noticeDetails">Details</button>
    <button class="icon-btn tiny" id="noticeClose" data-i18n-title="noticeClose" title="Dismiss" aria-label="Dismiss">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 4l8 8M12 4l-8 8" />
      </svg>
    </button>
  </div>

  <main class="stage">
    <iframe
      id="frame"
      src="https://chat.deepseek.com/"
      title="DeepSeek"
      allow="clipboard-read; clipboard-write; microphone; fullscreen"
    ></iframe>

    <div class="fallback" id="fallback" hidden>
      <p class="fb-title" data-i18n="fbTitle">Couldn’t embed the site</p>
      <p class="fb-body" data-i18n="fbBody">The site refused to load inside a frame, or the network failed. You can keep using it in a separate window — everything works the same.</p>
      <div class="fb-actions">
        <button class="btn primary" id="fbPopout" data-i18n="fbPopout">Open in a window</button>
        <button class="btn" id="fbRetry" data-i18n="fbRetry">Retry</button>
      </div>
    </div>

    <div class="diag" id="diag" hidden>
      <div class="diag-head">
        <span data-i18n="diagTitle">Diagnostics</span>
        <span class="spacer"></span>
        <button class="btn small" id="diagCopy" data-i18n="diagCopy">Copy</button>
        <button class="icon-btn" id="diagClose" data-i18n-title="diagClose" title="Close" aria-label="Close">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </div>
      <pre id="diagBody"></pre>
    </div>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
